# Builds the browser version of Approach and publishes it to GitHub Pages
# on every push to main. Setup steps are in the README ("Browser version on GitHub Pages").
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Site lives at https://<owner>.github.io/<repo>/ unless you set a custom domain (APP_URL + BASE_PATH variables).
      EXPO_BASE_URL: ${{ vars.BASE_PATH != '' && vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
      EXPO_PUBLIC_APP_URL: ${{ vars.APP_URL != '' && vars.APP_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      EXPO_PUBLIC_APP_STORE_ID: ${{ vars.APP_STORE_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check team sync keys
        # Describes the secrets' shape without printing their values.
        run: |
          U="$(printf '%s' "$EXPO_PUBLIC_SUPABASE_URL" | tr -d '[:space:]')"
          K="$(printf '%s' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          if [ -z "$U" ] || [ -z "$K" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing, so the site runs in demo mode."
            exit 0
          fi
          echo "Team sync keys found: the site will use Supabase."
          if [ "$U" != "$EXPO_PUBLIC_SUPABASE_URL" ]; then echo "URL check: the URL secret has spaces or line breaks (the app trims them)."; fi
          if printf '%s' "$U" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "URL check: looks right (https://<project>.supabase.co)."
          elif printf '%s' "$U" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/'; then
            echo "::warning::URL check: SUPABASE_URL has extra text after .supabase.co (for example /rest/v1/). The app trims it, but the secret should be just https://<project>.supabase.co"
          elif printf '%s' "$U" | grep -q 'supabase.com/dashboard'; then
            echo "::warning::URL check: SUPABASE_URL is a dashboard link. The app converts it, but the secret should be https://<project>.supabase.co"
          else
            echo "::warning::URL check: SUPABASE_URL doesn't look like https://<project>.supabase.co"
          fi
          case "$K" in
            eyJ*|sb_publishable_*) echo "Key check: looks like a public (anon/publishable) key." ;;
            sb_secret_*) echo "::error::Key check: SUPABASE_ANON_KEY is a SECRET key. Replace it with the anon or publishable key." ; exit 1 ;;
            *) echo "::warning::Key check: SUPABASE_ANON_KEY doesn't look like an anon (eyJ...) or publishable (sb_publishable_...) key." ;;
          esac
      - run: npx expo export --platform web --clear
      - run: node scripts/postbuild-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
